<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my-first-project｜占位首页</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      background: #f6f6f4;
      color: #2c2c2a;
    }
    .card {
      background: #ffffff;
      border: 1px solid #dcdcd6;
      border-radius: 12px;
      padding: 40px 48px;
      max-width: 520px;
      text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 12px; font-weight: 600; }
    p { font-size: 15px; line-height: 1.8; margin: 8px 0; color: #5f5e5a; }
    .tag {
      display: inline-block;
      margin-top: 20px;
      padding: 4px 12px;
      border-radius: 999px;
      background: #e1f5ee;
      color: #0f6e56;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>占位首页已上线</h1>
    <p>这是项目的第一个页面，目前只是一个占位符。</p>
    <p>真正的功能会从 Day 7 开始动手做。</p>
    <span class="tag">Day 2 · 首次提交</span>
  </div>
</body>
</html>
